baseURL = 'https://solareda.com/'
languageCode = 'en-us'
title = 'Zesty Pitz'
theme = 'PaperMod'

[params]
  env = "production"
  description = "Zesty Pitz - A Hugo Site"
  author = "Zesty Pitz"
  
  # Theme-specific params
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

[params.homeInfoParams]
  Title = "Welcome to Zesty Pitz"
  Content = "A modern, fast, and responsive Hugo blog"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/"

[[params.socialIcons]]
  name = "twitter"
  url = "https://twitter.com/"

[menu]

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]
