baseURL: https://ziikki.github.io/zestypitz/
languageCode: en-us
title: Solareda.com
theme: congo
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  author:
    name: Repitz
    image: /transparent_icon.png
  homepage:
    layout: profile
    showRecent: true
  social:
    buymeacoffee: https://buymeacoffee.com/solareda
  main:
    - css:
        - css/custom.css

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
  # footer:
  #   - name: home
  #     url: /
  #     weight: 10
  #   - name: posts
  #     url: /posts/
  #     weight: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON
